name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt flask pyinstaller requests
      - name: Build EXE
        run: |
          pyinstaller --onefile --name PortfolioTracker web_app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioTracker-Windows
          path: dist/PortfolioTracker.exe
          retention-days: 30
